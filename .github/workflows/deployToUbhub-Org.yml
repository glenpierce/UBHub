name: Decode Session

on:
  workflow_dispatch:
    inputs:
      cookie:
        description: 'Session cookie value (optional — falls back to secrets.COOKIE)'
        required: false
        default: ''

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} .
      - name: Install Node 22.21.1
        run: |
          NODE_VERSION=22.21.1
          curl -fsSLO https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz
          sudo tar -C /usr/local --strip-components 1 -xf node-v$NODE_VERSION-linux-x64.tar.xz
      - name: Install dependencies
        run: |
          cd tools
          node -v
          npm -v
          npm ci --ignore-scripts --loglevel verbose
      - name: Decode session
        env:
          SECRET: ${{ secrets.KEY }}
          COOKIE: ${{ github.event.inputs.cookie || secrets.COOKIE }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "Missing secret: KEY"
            exit 1
          fi
          if [ -z "$COOKIE" ]; then
            echo "No cookie provided via input or secrets.COOKIE"
            exit 1
          fi
          node tools/decodeSession.js "$COOKIE" "$SECRET"