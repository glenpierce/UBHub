services:
  db:
    container_name: ubhub_db
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: ubhub
      MYSQL_USER: root
      MYSQL_PASSWORD: my-secret-pw
    ports:
      - "3306:3306"
    volumes:
      - ubhub_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ubhub:
    environment:
      # Override production secrets to point at the local MySQL container
      RDS_HOST: 127.0.0.1
      RDS_PORT: 3306
      RDS_DATABASE: ubhub
      RDS_USER: root
      RDS_PASSWORD: my-secret-pw

volumes:
  ubhub_db_data: