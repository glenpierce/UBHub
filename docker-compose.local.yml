services:
  node:
    container_name: ubhub_node_local
    build:
      context: ./nodeServer
      dockerfile: Dockerfile
    image: ubhub-node-local:latest
    working_dir: /usr/src/app
    ports:
      - "3000:3000"
    # Use an env_file so secrets are not stored in the compose file. Create a `.env.local` next to
    # this compose file with the real credentials (see .env.local).
    env_file: .env.local
    # Mount the app source so edits are visible inside the container.
    # Keep node_modules inside a named volume so npm runs happen in the container only.
    volumes:
      - ./nodeServer:/usr/src/app:cached
      - node_server_node_modules:/usr/src/app/node_modules
    # Run installs inside the container and then start the application.
    # For iterative development you can remove the `npm ci` here and run it manually via `docker compose exec`.
    command: ["sh", "-c", "npm i --ignore-scripts --prefer-offline --no-audit && npm start"]
    restart: unless-stopped

  mysql-local:
    container_name: ubhub_mysql_local
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${RDS_PASSWORD}
      MYSQL_DATABASE: ${RDS_DATABASE}
      MYSQL_USER: ${RDS_USER}
      MYSQL_PASSWORD: ${RDS_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  node_server_node_modules:
