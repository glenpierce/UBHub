services:
  db:
    container_name: ubhub_db
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: ubhub
      MYSQL_USER: root
      MYSQL_PASSWORD: my-secret-pw
    ports:
      - "3306:3306"
    volumes:
      - ubhub_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ubhub:
    environment:
      # Override production secrets to point at the local MySQL container
      RDS_HOST: 127.0.0.1
      RDS_PORT: 3306
      RDS_DATABASE: ubhub
      RDS_USER: root
      RDS_PASSWORD: my-secret-pw

  node-server-test:
    build:
      context: ./nodeServer
      dockerfile: Dockerfile.test
    image: ubhub-node-test:latest
    working_dir: /usr/src/app
    environment:
      NODE_ENV: test
      CI: "true"
    # Do not mount host node_modules to avoid platform mismatch; use named volume instead
    volumes:
      - ./nodeServer:/usr/src/app:cached
      - node_server_node_modules:/usr/src/app/node_modules
    entrypoint: ["sh", "-c", "npm ci && npm test"]

volumes:
  ubhub_db_data:
  node_server_node_modules:
