version: "3.1"
services:
  ubhub:
    container_name: ubhub
    restart: on-failure
    build: ./
    ports:
      - "3000:3000"
    environment:
      RDS_HOST: /run/secrets/rds_host
      RDS_DATABASE: /run/secrets/rds_database
      RDS_USER: /run/secrets/rds_user
      RDS_PASSWORD: /run/secrets/rds_password
    secrets:
      - rds_host
      - rds_database
      - rds_user
      - rds_password

secrets:
  rds_host:
    file: secrets/rds_host.txt
  rds_database:
    file: secrets/rds_database.txt
  rds_user:
    file: secrets/rds_user.txt
  rds_password:
    file: secrets/rds_password.txt
